name: deploy

on:
  push:
    branches: [ master ]



jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter image
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - name: Get dependencies (pub get)
        run: flutter pub get
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build (Web)
        run: flutter build web --base-href "${{ steps.pages.outputs.base_path }}/"
      # The app uses path URLs (usePathUrlStrategy). GitHub Pages serves 404.html for unknown
      # paths, so a copy of index.html lets deep links and reloads open the app.
      # Such pages still return HTTP status 404 (the app renders fine, but search engines
      # won't index them). GitHub Pages can't rewrite URLs; to get 200, move to a host that
      # supports SPA rewrites.
      - name: Add SPA fallback (404.html)
        run: cp build/web/index.html build/web/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4